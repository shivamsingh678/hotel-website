<!DOCTYPE html>
<html>
<head>
    <title>Room Booking</title>
</head>
<body>

<h1 align="center">Room Booking Form</h1>

<form align="center">

    Name:
    <input type="text">
    <br><br>

    Mobile Number:
    <input type="tel">
    <br><br>

    Email:
    <input type="email">
    <br><br>

    Room Type:
    <select>
        <option>Single Room</option>
        <option>Double Room</option>
        <option>Luxury Room</option>
    </select>

    <br><br>

    Check In Date:
    <input type="date">

    <br><br>

    <input type="submit" value="Book Now">

</form>

<br>

<center>
<a href="index.html">
    <button>Back to Home</button>
</a>
</center>

</body>
</html>
